<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shoe Inventory and Sales Tracker | Inventory Dashboard</title>
  </head>
  <body>
    <section class="container">
      <aside>
        <p class="icon">Shoe Inventory</p>

        <section class="main-menu">
          <ul>
            <li>Dashboard</li>
            <li>Dashboard</li>
          </ul>
        </section>
      </aside>
      <header>
        <section class="left-side">
          <h1 class="welcome-text">Welcome, Admin</h1>
        </section>
        <section class="right-side">
          <button type="button">➕ Add Product</button>
        </section>
      </header>
      <main class="site-container">
        <section class="summary-box">
          <div class="box">
            <h2 class="box-text">Total Asset</h2>
            <p class="total-asset-figure">20,000</p>
          </div>
          <div class="box">
            <h2 class="box-text">Total Asset</h2>
            <p class="total-asset-figure">20,000</p>
          </div>
          <div class="box">
            <h2 class="box-text">Total Asset</h2>
            <p class="total-asset-figure">20,000</p>
          </div>
          <div class="box">
            <h2 class="box-text">Total Asset</h2>
            <p class="total-asset-figure">20,000</p>
          </div>
        </section>
        <section class="sales-container">
          <div class="Ls-search-box">
            <input
              type="search"
              name="search"
              id="search"
              placeholder="Search"
            />
          </div>
          <div class="Rs-search-box">
            <input
              type="date"
              name=""
              id=""
              placeholder="12 Sept - 12 October"
            />
          </div>
        </section>
      </main>
    </section>
  </body>
</html>
